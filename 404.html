<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Page Not Found</title>

  <!-- SEO Meta -->
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="Oops! The page you're looking for doesn’t exist. Explore Bamboost's SEO services, blogs, and resources." />

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 80px;
      margin: 0;
      color: #4CAF50;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #666;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      margin: 10px;
      background: #4CAF50;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #43a047;
    }

    .links {
      margin-top: 20px;
    }

    .links a {
      display: block;
      margin: 5px 0;
      color: #4CAF50;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .search-box {
      margin-top: 20px;
    }

    input[type="text"] {
      padding: 10px;
      width: 70%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #4CAF50;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #43a047;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>
      The page you are looking for might have been removed, renamed, or is temporarily unavailable.
    </p>
    <!-- CTA Buttons -->
    <a href="https://bamboost.in" class="btn">Go to Homepage</a>
    <a href="https://bamboost.in/services.html" class="btn">Our Services</a>

  </div>
</body>
</html>
